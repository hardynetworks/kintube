name: Build HardyOS package

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['hardyos/**', '.github/workflows/hardyos.yml']
  pull_request:
    paths: ['hardyos/**', '.github/workflows/hardyos.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: kincast.hardyapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin the version on tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '
            .version = $v
            | .settings |= map(if .env == "KINCAST_TAG" then .default = $v else . end)
          ' hardyos/hardyapp.json > hardyapp.json.new
          mv hardyapp.json.new hardyos/hardyapp.json

      - name: Check the manifest
        run: |
          jq -e '.format == 1 and .id == "kincast" and (.icon | test("^icon\\.(svg|png)$"))' hardyos/hardyapp.json
          for f in hardyapp.json compose.yaml icon.svg; do test -f "hardyos/$f"; done

      - name: Check the compose file resolves
        run: |
          cd hardyos
          HARDY_APP_DATA=/tmp/kincast HARDY_HOST=nas.local HARDY_TZ=UTC HARDY_PORT_WEB=8095 HARDY_PORT_RTMP=1935 \
          POSTGRES_PASSWORD=x SESSION_SECRET=x RTMP_CALLBACK_SECRET=x MAX_UPLOAD_GB=20 \
          TRANSCODE_RENDITIONS=1080,720,360 X264_PRESET=veryfast KEEP_ORIGINALS=true KINCAST_TAG=latest \
            docker compose -f compose.yaml config --quiet

      - name: Pack
        run: |
          # A .hardyapp is a gzipped tar with the files at the top level.
          tar --owner=0 --group=0 --numeric-owner --mtime='1970-01-01' --sort=name \
            -czf kincast.hardyapp -C hardyos hardyapp.json compose.yaml icon.svg README.md
          ls -l kincast.hardyapp
          sha256sum kincast.hardyapp | tee kincast.hardyapp.sha256
          test "$(stat -c %s kincast.hardyapp)" -le 524288

      - uses: actions/upload-artifact@v4
        with:
          name: kincast.hardyapp
          path: |
            kincast.hardyapp
            kincast.hardyapp.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "KinCast $tag" --generate-notes
          gh release upload "$tag" kincast.hardyapp kincast.hardyapp.sha256 --clobber
